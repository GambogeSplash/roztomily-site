<!--
  ROZTOMILY EMAIL SIGNATURE — master template
  ----------------------------------------------------------
  Replace the four {{PLACEHOLDERS}} below, then paste the rendered
  signature into Zoho Mail (Settings > Signatures > paste as HTML),
  Gmail, or Outlook. Logo is served live from roztomilygroup.com,
  so it renders in any mail client without attaching an image.

  HOW TO PASTE:
  - Easiest: open this file in a browser, select the signature block
    with your mouse, copy, and paste into the signature editor.
  - Or in Zoho: Settings > Mail > Signatures > New > switch the editor
    to source/HTML view (the < > icon) and paste the markup directly.

  Placeholders:
    {{NAME}}   e.g. Roztomily Team   /   Adaeze Okafor
    {{TITLE}}  e.g. Client Services  /   Managing Partner
    {{EMAIL}}  e.g. hello@roztomilygroup.com
    {{PHONE}}  e.g. +234 913 918 4995
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#160f0c;">
  <tr>
    <!-- Logo lockup -->
    <td valign="top" style="padding:0 20px 0 0;border-right:2px solid #dc2c25;">
      <a href="https://www.roztomilygroup.com" style="text-decoration:none;">
        <img src="https://www.roztomilygroup.com/roztomily/logo.png" alt="Roztomily" width="104" height="102" style="display:block;border:0;outline:none;width:104px;height:auto;">
      </a>
    </td>
    <!-- Details -->
    <td valign="top" style="padding:2px 0 0 20px;">
      <div style="font-size:16px;line-height:20px;font-weight:bold;color:#160f0c;letter-spacing:0.2px;">{{NAME}}</div>
      <div style="font-size:12px;line-height:18px;color:#898683;padding-top:1px;">{{TITLE}}</div>
      <div style="height:9px;line-height:9px;font-size:0;">&nbsp;</div>
      <div style="font-size:12px;line-height:20px;color:#4d4846;">
        <a href="tel:{{PHONE}}" style="color:#4d4846;text-decoration:none;">{{PHONE}}</a>
        &nbsp;&middot;&nbsp;
        <a href="mailto:{{EMAIL}}" style="color:#4d4846;text-decoration:none;">{{EMAIL}}</a>
      </div>
      <div style="font-size:12px;line-height:20px;">
        <a href="https://www.roztomilygroup.com" style="color:#dc2c25;text-decoration:none;font-weight:bold;">www.roztomilygroup.com</a>
      </div>
      <div style="font-size:11px;line-height:16px;color:#898683;padding-top:5px;">
        47 Hassan Balogun St, Isheri Olofin, Lagos
      </div>
    </td>
  </tr>
</table>
